    <!-- JavaScript to display status messages from PHP script -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const params = new URLSearchParams(window.location.search);
            const status = params.get('status');
            const msgDiv = document.getElementById('status-message');
            
            if (status) {
                let message = '';
                let classes = 'p-4 rounded-lg font-medium ';

                if (status === 'success') {
                    message = 'Thank you for your message! I will get back to you as soon as possible.';
                    classes += 'bg-green-100 text-green-800';
                } else if (status === 'error') {
                    const errorType = params.get('error');
                    if (errorType === 'fields') {
                        message = 'Error: Please fill in all required fields correctly (Name, Email, and Message).';
                    } else if (errorType === 'send_fail') {
                        message = 'An unexpected error occurred while trying to send your message. Please check the contact.php configuration.';
                    } else {
                        message = 'An unexpected error occurred while processing your message. Please try again later.';
                    }
                    classes += 'bg-red-100 text-red-800';
                }

                if (message) {
                    msgDiv.innerHTML = `<div class="${classes}">${message}</div>`;
                    
                    // Remove query parameters from URL after a few seconds for a cleaner look
                    setTimeout(() => {
                        history.replaceState(null, '', window.location.pathname);
                    }, 5000);
                }
            }
        });
    </script>
