<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patrick Nunn Portfolio</title>
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Rubik:ital,wght@0,300..900;1,300..900&display=swap" rel="stylesheet">

    <style>
        /* --- START Customization Variables --- */
        :root {
            /* 1. ACCENT COLOR: Change this HEX code to your desired color (e.g., #ef4444 for red) */
            --color-accent: #0a0a80; 
            
            /* 2. FONT FAMILY: Uses the font loaded above (Montserrat) as the primary font */
            --font-family: 'Rubik', sans-serif;
        }
        /* --- END Customization Variables --- */

        /* Global styles applying the variables */
        /* Set the default font and ensure the body covers the full viewport height */
        body {
           
           
            min-height: 100vh;
            margin: 0;
            
            /* --- Background Image Configuration --- */
            /* Added a subtle dark overlay (rgba(0,0,0,0.4)) on top of the image for better contrast with the white card */
            background-image: linear-gradient(rgba(0, 0, 0, 0.4), rgba(0, 0, 0, 0.4)), 
                              url('assets/starfield2.png');
            background-size: cover; /* Ensures the image covers the entire screen, responsive */
            background-position: center; /* Centers the image */
            background-attachment: fixed; /* Keeps the image fixed while scrolling (optional) */
            
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 1rem; /* Add padding for mobile screens */
        }
    </style>
</head>
<body>

    <!-- Main Content Container -->
    <!-- Centered and constrained width for large screens, full width on small screens -->
    <div class="w-full max-w-4xl p-8 bg-[#506DAF] shadow-2xl transition-all duration-300 border-8 border-[#0C1633]">

        <!-- Header/Hero Section -->
        <header class="text-center mb-12">
            <h1 class="text-5xl md:text-6xl font-extrabold text-gray8400 mb-4 tracking-tight">
                Patrick Nunn
            </h1>
            <p class="text-xl text-gray-200 max-w-xl mx-auto">
                Welcome to Patrick Nunn's portfolio.
            </p>
        </header>

        <!-- Button Navigation Section (Now uses <a> tags for actual navigation) -->
        <nav class="flex flex-col sm:flex-row justify-center items-center space-y-4 sm:space-y-0 sm:space-x-20">

            <!-- About Link -->
            <!-- Converted to <a> tag and added text-center to maintain button appearance -->
            <a href="about.html"
               class="w-full sm:w-auto px-10 py-4 text-lg text-center font-semibold text-white bg-[#6250AF] shadow-lg hover:bg-[#509DAF] transition duration-300 transform hover:scale-[1.03] focus:outline-none focus:ring-4 focus:ring-gray-300 border-4 border-[#0C1633]">
                About
            </a>

            <!-- Projects Link -->
            <!-- Converted to <a> tag and added text-center to maintain button appearance -->
            <a href="projects.html"
                class="w-full sm:w-auto px-10 py-4 text-lg text-center font-semibold text-white bg-[#6250AF] shadow-lg hover:bg-[#509DAF] transition duration-300 transform hover:scale-[1.03] focus:outline-none focus:ring-4 focus:ring-gray-300 border-4 border-[#0C1633]">
                Projects
            </a>

            <!-- Contact Link -->
            <!-- Converted to <a> tag and added text-center to maintain button appearance -->
            <a href="contact.html"
                class="w-full sm:w-auto px-10 py-4 text-lg text-center font-semibold text-white bg-[#6250AF] shadow-lg hover:bg-[#509DAF] transition duration-300 transform hover:scale-[1.03] focus:outline-none focus:ring-4 focus:ring-gray-300 border-4 border-[#0C1633]">
                Contact
            </a>
        </nav>

        <!-- Optional Footer Placeholder -->
        <footer class="mt-16 text-center text-gray-200 text-sm">
            &copy; 2025 Patrick Nunn. All rights reserved.
        </footer>

    </div>

</body>
</html>
